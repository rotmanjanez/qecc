name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  python:
    name: 🐍
    uses: rotmanjanez/workflows/.github/workflows/reusable-python-ci.yml@1b7ef95f9331f2e42c8ba75315deaecfbe007981 # feat/python-version-matrix
    with:
      enable-ty: true
      enable-mypy: false
    secrets: inherit
    permissions:
      contents: read
      id-token: write
